[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-ocr-pii-ner"
version = "0.1.0"
description = "OCR text PII findings schema and initial detectors for Aegis"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["easyocr==1.7.2", "spacy==3.8.16"]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
